<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />

<title>Ademilson Albino — Analista de TI Júnior (Suporte & Infra)</title>
<meta name="description" content="Suporte & Infra: AD/Entra, Microsoft 365, Windows Server, Intune e Redes.">

<style>
:root{
  --text:#0f172a;
  --muted:#4b5563;
  --border:#e5e7eb;
  --h:#111827;
  --accent:#2563eb;
  --bg:#ffffff;
  --chip-bg:#eef2ff;
  --chip-fg:#3730a3;
}

html,body{margin:0;padding:0}

body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,Helvetica,sans-serif;
  color:var(--text);
  background:var(--bg);
  line-height:1.55;
  -webkit-print-color-adjust: exact;
}

/* ====== CONTAINER ====== */
.container{
  max-width:960px;
  margin:32px auto 48px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 18px 45px rgba(2,8,23,.08);
  padding:32px 40px;
}

/* ====== HEADER ====== */
header.top{
  display:flex;
  gap:20px;
  align-items:center;
  border-bottom:1px solid var(--border);
  padding-bottom:16px;
  margin-bottom:22px;
}

.avatar{
  width:96px;
  height:96px;
  border-radius:999px;
  overflow:hidden;
  border:2px solid var(--border);
  background:#f3f4f6
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

h1{margin:0;font-size:28px;color:var(--h)}

.role{
  margin:6px 0 10px;
  font-size:14px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--accent)
}

.contact{font-size:13px;color:var(--muted)}
.contact a{color:var(--h);text-decoration:none}

/* ====== SECTIONS ====== */
.section{margin:24px 0}

.section-title{
  margin:0 0 10px;
  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.16em;
}

.job-title{margin:0;font-size:16px;font-weight:800}
.job-meta{margin:4px 0 10px;font-size:12px;color:var(--muted)}

p{
  margin:0 0 12px;
  text-align:justify;
}

ul{margin:8px 0 0;padding-left:18px}
li{margin:6px 0;text-align:justify}

.subhead{
  font-size:12.5px;
  color:var(--muted);
  font-weight:700;
  margin-top:10px
}

/* ====== CHIPS ====== */
.skills{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:6px 12px;
  border-radius:999px;
  background:var(--chip-bg);
  color:var(--chip-fg);
  font-size:12px;
  border:1px solid rgba(79,70,229,.25)
}

/* ====== BOTÃO PDF ====== */
#downloadPDF{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-bottom:12px;
  padding:8px 14px;
  background:#111827;
  color:#fff;
  border:none;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}

/* ===================================================== */
/* ==================== PRINT (PDF) ==================== */
/* ===================================================== */
@media print{

@page{
  size:A4;
  margin:1.2cm;
}

body{
  width:210mm;
  font-size:11pt;
  background:#fff;
}

#downloadPDF{display:none}

.container{
  max-width:none;
  width:100%;
  padding:0;
  margin:0;
  border:none;
  box-shadow:none;
}

header.top{
  display:block;
}

.avatar{
  float:right;
  margin:0 0 12px 12px;
  border:1px solid #eee;
}

/* CORREÇÃO DEFINITIVA DO TEXTO */
p, li{
  text-align:justify;
  hyphens:none;
  -webkit-hyphens:none;
  word-break:normal;
  overflow-wrap:break-word;
}

/* Evita cortes feios */
section, article, ul, li{
  break-inside:avoid;
  page-break-inside:avoid;
}

a{
  color:#111;
  text-decoration:none;
}
}

/* ====== MOBILE ====== */
@media (max-width:640px){
  .container{padding:24px}
  header.top{flex-direction:column;align-items:flex-start}
  p,li{text-align:left}
}
</style>
</head>

<main class="container">

<header class="top">

    </p>
  </div>
</header>
