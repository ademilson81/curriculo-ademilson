  <style>
    :root{
      --text:#0f172a;      /* slate-900 */
      --muted:#4b5563;     /* gray-600 */
      --border:#e5e7eb;    /* gray-200 */
      --h:#111827;         /* title color */
      --accent:#2563eb;    /* blue-600 */
      --bg:#ffffff;
      --chip-bg:#eef2ff;   /* indigo-50 */
      --chip-fg:#3730a3;   /* indigo-800 */
    }

    html,body{margin:0;padding:0}
    body{
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,Helvetica,sans-serif;
      color:var(--text); background:var(--bg); line-height:1.55;
    }

    .container{
      max-width:960px; margin:32px auto 48px; background:#fff;
      border:1px solid var(--border); border-radius:16px;
      box-shadow:0 18px 45px rgba(2,8,23,.08); padding:32px 40px;
    }

    /* Header */
    header.top{
      display:flex; gap:20px; align-items:center;
      border-bottom:1px solid var(--border);
      padding-bottom:16px; margin-bottom:22px;
    }
    .avatar{width:96px;height:96px;border-radius:999px;overflow:hidden;border:2px solid var(--border)}
    .avatar img{width:100%;height:100%;object-fit:cover;display:block}
    h1{margin:0;color:var(--h);font-size:28px}
    .role{margin:6px 0 10px;font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
    .contact{font-size:13px;color:var(--muted)}
    .contact a{color:var(--h);text-decoration:none;border-bottom:1px dotted #cbd5e1}
    .contact a:hover{color:var(--accent);border-bottom-color:var(--accent)}

    /* Sections */
    .section{margin:24px 0}
    .section-title{margin:0 0 10px;font-size:13px;font-weight:800;color:var(--h);text-transform:uppercase;letter-spacing:.16em}
    .job-title{margin:0;font-size:16px;font-weight:800;color:var(--h)}
    .job-meta{margin:4px 0 10px;font-size:12px;color:var(--muted)}
    p{margin:0 0 8px}
    ul{margin:8px 0 0;padding-left:18px}
    li{margin:6px 0}
    .subhead{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:10px}

    /* Chips */
    .skills{display:flex;flex-wrap:wrap;gap:8px}
    .chip{padding:6px 12px;border-radius:999px;background:var(--chip-bg);color:var(--chip-fg);font-size:12px;border:1px solid rgba(79,70,229,.25)}

    /* PDF button */
    #downloadPDF{
      display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;
      padding:8px 14px;background:#111827;color:#fff;border:none;border-radius:999px;
      font-size:12px;font-weight:700;cursor:pointer
    }

    /* Print */
    @media print{
      #downloadPDF{display:none}
      .container{margin:0;border-radius:0;box-shadow:none;max-width:100%}
      a:after{content:" (" attr(href) ")";font-size:11px;color:#555}
    }

    /* Small screens */
    @media (max-width:640px){
      .container{padding:24px}
      .avatar{width:80px;height:80px}
    }
  </style>
</head>
